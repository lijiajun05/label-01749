version: '3.8'

services:
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: class-manage-mysql
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      TZ: Asia/Shanghai
    networks:
      - class-manage-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: class-manage-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/class_manage?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: classmanage
      SPRING_DATASOURCE_PASSWORD: classmanage123
    networks:
      - class-manage-network

  frontend:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: class-manage-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
    networks:
      - class-manage-network

volumes:
  mysql_data:
    name: class-manage-mysql-data

networks:
  class-manage-network:
    name: class-manage-network
    driver: bridge
